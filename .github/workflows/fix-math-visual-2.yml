name: Apply math question visual fix

on:
  push:
    branches: [main]
    paths-ignore:
      - 'math.html'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable code-rendered question illustrations
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('math.html')
          s = p.read_text(encoding='utf-8')
          old = '.visual{display:none!important}'
          new = '.visual{display:block!important}'
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and push if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add math.html
          if git diff --cached --quiet; then
            echo 'math.html already has the correct visual setting; nothing to commit.'
            exit 0
          fi
          git commit -m 'fix: show code-rendered math illustrations'
          git push
