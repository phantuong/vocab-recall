name: Apply math question visual fix

on:
  push:
    branches: [main]
    paths-ignore:
      - 'math.html'
      - 'math-visuals.js'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire code-rendered question illustrations
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path('math.html')
          s = html.read_text(encoding='utf-8')

          # Load the dedicated visual renderer before the app's inline JS.
          marker = '<script src="math-questions.js"></script>'
          visual_tag = marker + '<script src="math-visuals.js?v=4"></script>'
          if 'math-visuals.js?v=4' not in s and marker in s:
              s = s.replace(marker, visual_tag, 1)

          # The inline app currently defines a legacy visual() function. After
          # the app is loaded, replace the global function with the dedicated
          # renderer so every question can use the SVG/HTML illustrations.
          bridge = '<script>if(window.mathVisual){window.visual=window.mathVisual;}</script>'
          if bridge not in s:
              s = s.replace('</body>', bridge + '</body>', 1)

          s = s.replace('.visual{display:none!important}', '.visual{display:block!important}', 1)
          html.write_text(s, encoding='utf-8')

          js = Path('math-visuals.js')
          j = js.read_text(encoding='utf-8')
          if 'window.mathVisual = visual;' not in j:
              idx = j.rfind('})();')
              if idx == -1:
                  raise SystemExit('Could not find renderer IIFE ending')
              j = j[:idx] + 'window.mathVisual = visual;\n' + j[idx:]
              js.write_text(j, encoding='utf-8')
          PY
      - name: Commit and push if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add math.html math-visuals.js
          if git diff --cached --quiet; then
            echo 'Visual renderer is already wired; nothing to commit.'
            exit 0
          fi
          git commit -m 'fix: wire math visual renderer into practice questions'
          git push
