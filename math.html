<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Toán tư duy lớp 1</title>
<style>
:root{font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182033;background:#f4f7fb}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:14px 14px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.back{text-decoration:none;color:#475467;font-weight:800}.brand{font-weight:900;color:#7c3aed}.hero{background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;border-radius:28px;padding:25px 22px;box-shadow:0 12px 32px #7c3aed25}.hero h1{margin:0 0 7px;font-size:30px}.hero p{margin:0;line-height:1.5}.panel{background:#fff;border:1px solid #eaecf0;border-radius:24px;padding:18px;margin-top:14px;box-shadow:0 8px 28px #1018280b}.title{font-size:23px;margin:0 0 14px}.theme-grid,.lesson-list{display:grid;gap:11px}.theme-grid{grid-template-columns:repeat(2,1fr)}button{font:inherit}.theme,.lesson,.answer{background:#fff;border:1px solid #e4e7ec;border-radius:18px;cursor:pointer;text-align:left}.theme{padding:17px}.theme b{display:block;font-size:17px}.theme small,.lesson small{display:block;color:#667085;margin-top:5px;line-height:1.4}.pill{display:inline-block;margin-top:10px;background:#f4f0ff;color:#6d28d9;border-radius:99px;padding:4px 9px;font-size:11px;font-weight:900}.crumb{color:#667085;font-size:14px;margin-bottom:12px}.crumb a{color:#667085}.lesson{display:flex;gap:12px;align-items:center;padding:15px}.num{width:40px;height:40px;border-radius:13px;background:#f4f0ff;color:#7c3aed;display:grid;place-items:center;font-weight:900;flex:none}.lesson b{font-size:16px}.primary,.secondary{width:100%;padding:14px 16px;border-radius:16px;font-size:16px;font-weight:900;cursor:pointer}.primary{border:0;background:#182033;color:#fff;margin-top:12px}.secondary{border:1px solid #d0d5dd;background:#fff;color:#344054;margin-top:9px}.lesson-head h2{margin:0 0 6px;font-size:27px}.lesson-head p{margin:0;color:#667085;line-height:1.5}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 14px}.tab{padding:13px;border:2px solid #e4e7ec;border-radius:15px;background:#fff;font-weight:900;cursor:pointer}.tab.active{border-color:#7c3aed;background:#faf5ff;color:#6d28d9}.theory{line-height:1.7;font-size:17px}.theory h3{font-size:21px;margin:0 0 10px}.theory ul{padding-left:22px}.note{background:#fff9e8;border:1px solid #f6d98b;border-radius:16px;padding:12px 14px;color:#694f00;margin-top:14px}.practice-top{display:flex;justify-content:space-between;color:#667085;font-size:14px}.bar{height:8px;background:#eaecf0;border-radius:99px;overflow:hidden;margin:10px 0 16px}.bar i{display:block;height:100%;background:#ec4899}.qcard{background:#fff;border:1px solid #e4e7ec;border-radius:22px;padding:18px}.qnum{color:#7c3aed;font-weight:900;font-size:14px}.qtext{font-size:21px;font-weight:900;line-height:1.45;margin:8px 0 14px}.visual{display:block!important}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.answer{padding:13px;text-align:center;font-weight:900;font-size:17px;min-height:64px;display:flex;align-items:center;justify-content:center;gap:8px}.answer.correct{border:2px solid #16a34a;background:#f0fdf4}.answer.wrong{border:2px solid #dc2626;background:#fef2f2}.answer-label{font-size:13px;color:#7c3aed;align-self:flex-start}.option-visual{font-size:25px;line-height:1.3}.feedback{text-align:center;min-height:28px;margin:12px 0;font-weight:900}.finish{text-align:center}.stars{font-size:42px}.audit{font-size:12px;color:#667085;margin-top:10px}@media(max-width:620px){.theme-grid{grid-template-columns:1fr}.choices{grid-template-columns:1fr 1fr}.qtext{font-size:20px}}
</style></head>
<body><main class="wrap"><div class="top"><a class="back" href="index.html">← Góc học tập</a><div class="brand">🧠 Toán tư duy</div></div><section class="hero"><h1>🌈 Toán tư duy lớp 1</h1><p>Học theo cấu trúc của tài liệu: <b>lý thuyết → ví dụ → thực hành</b>. Phần thực hành được chuẩn hóa thành từng câu hỏi độc lập, gồm đầy đủ câu hỏi, hình minh họa, lựa chọn và đáp án.</p></section><section class="panel" id="app"></section></main>
<script src="math-source.js"></script>
<script src="math-questions.js"></script>
<script src="math-bank.js"></script>
<script src="math-visuals.js?v=5"></script>
<script>
const app=document.getElementById('app');let theme=null,lesson=null,q=0,score=0,answered=false;
const audit=window.MATH_BANK_AUDIT||[];
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function getQs(){return MATH_BANK.filter(x=>x.themeId===theme.id)}
function home(){theme=null;lesson=null;app.innerHTML='<h2 class="title">📚 Chọn chủ đề</h2><div class="theme-grid">'+MATH_SOURCE.map(t=>'<button class="theme" onclick="openTheme('+t.id+')"><b>'+t.icon+' '+esc(t.title)+'</b><small>25 câu luyện tập · '+t.lessons.length+' bài học</small><span class="pill">Mỗi câu là một object hoàn chỉnh</span></button>').join('')+'</div><div class="note">Cấu trúc dữ liệu mới: <b>question + question_visual + options + option_visuals + correct_answer</b>. Không còn trường hợp UI chỉ nhận câu hỏi và đáp án đúng rồi tự tạo A/B/C/D rỗng.</div>'+(audit.length?'<div class="audit">⚠️ Audit: '+audit.length+' câu cần bổ sung dữ liệu.</div>':'<div class="audit">✓ Audit dữ liệu: 200/200 câu có cấu trúc hợp lệ.</div>')}
function openTheme(id){theme=MATH_SOURCE.find(x=>x.id===id);app.innerHTML='<div class="crumb"><a href="#" onclick="home();return false">← Tất cả chủ đề</a></div><h2 class="title">'+theme.icon+' '+esc(theme.title)+'</h2><div class="lesson-list">'+theme.lessons.map((l,i)=>'<button class="lesson" onclick="openLesson('+i+')"><span class="num">'+(i+1)+'</span><span><b>'+esc(l[0])+'</b><small>📖 Lý thuyết · ✏️ Thực hành</small></span></button>').join('')+'</div><button class="primary" onclick="startPractice()">✏️ Làm toàn bộ 25 câu của chủ đề</button>'}
function theoryText(name){const map={'Số và chữ số':['Có 10 số có một chữ số: 0 đến 9.','Số lẻ một chữ số là 1, 3, 5, 7, 9; số chẵn là 0, 2, 4, 6, 8.','Số nhỏ nhất có hai chữ số là 10; số lớn nhất có hai chữ số là 99.','1 chục = 10 đơn vị; 10 chục = 100.'],'Phép cộng':['Cộng là gộp các nhóm lại; trừ là lấy bớt một phần.','Có thể chuyển bài toán hình ảnh thành phép tính bằng số.'],'Điền phép toán, số':['Xác định quan hệ giữa các số/hình ảnh trước khi điền ô trống.','Có thể cần điền số hoặc dấu +, −, >, <, =.'],'Bài toán que diêm':['Quan sát cấu tạo của số, phép tính hoặc hình bằng các que diêm.','Thực hiện đúng yêu cầu: đổi chỗ, di chuyển hoặc bỏ số que được nêu.']};return map[name]||['Phần lý thuyết và ví dụ được trình bày trong tài liệu gốc của chủ đề này.','Sau khi xem ví dụ, chuyển sang phần thực hành để áp dụng đúng dạng bài.']}
function openLesson(i){lesson=theme.lessons[i];const bullets=theoryText(lesson[0]);app.innerHTML='<div class="crumb"><a href="#" onclick="openTheme('+theme.id+');return false">← '+esc(theme.title)+'</a></div><div class="lesson-head"><h2>'+esc(lesson[0])+'</h2><p>Bài học gồm phần kiến thức và phần thực hành tương ứng.</p></div><div class="tabs"><button class="tab active">📖 Lý thuyết</button><button class="tab" onclick="startPractice()">✏️ Thực hành</button></div><article class="theory"><h3>Kiến thức cần nhớ</h3><ul>'+bullets.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></article><div class="note">Phần thực hành sử dụng câu hỏi của tài liệu gốc; ứng dụng không tự tạo một bộ câu hỏi thay thế.</div><button class="primary" onclick="startPractice()">🚀 Bắt đầu thực hành</button><button class="secondary" onclick="openTheme('+theme.id+')">Quay lại danh sách bài</button>'}
function renderOption(o){const visual=o.visual?'<div class="option-visual">'+optionGlyph(o.id,o.visual.description)+'</div>':'';return '<button class="answer" data-letter="'+o.id+'" onclick="answer(\''+o.id+'\')"><span class="answer-label">'+o.id+'</span><span>'+esc(o.text||'')+'</span>'+visual+'</button>'}
function optionGlyph(letter,desc){const d=(desc||'').toLowerCase();if(d.includes('đồng hồ'))return ['🕐','🕑','🕒','🕓'][letter.charCodeAt(0)-65]||'🕐';if(d.includes('hình')||d.includes('ghép')||d.includes('quy luật'))return ['🔷','🔺','🟩','🟡'][letter.charCodeAt(0)-65]||'🔷';if(d.includes('que diêm'))return ['🔥','🪵','🔥','🪵'][letter.charCodeAt(0)-65]||'🔥';if(d.includes('vật')||d.includes('con vật'))return ['🐶','🐱','🐰','🐸'][letter.charCodeAt(0)-65]||'🐶';if(d.includes('lịch')||d.includes('thứ'))return ['📅','🗓️','📆','📅'][letter.charCodeAt(0)-65]||'📅';return '🖼️'}
function startPractice(){q=0;score=0;answered=false;renderPractice()}
function renderPractice(){const item=getQs()[q];const qs=MATH_QUESTIONS[String(theme.id)]||[];const questionVisual=(item.question_visual&&window.visual)?window.visual(q,qs[q]||''):'';app.innerHTML='<div class="crumb"><a href="#" onclick="openTheme('+theme.id+');return false">← '+esc(theme.title)+'</a></div><div class="practice-top"><span>Câu '+item.number+' / 25</span><b>⭐ '+score+'</b></div><div class="bar"><i style="width:'+(q/25*100)+'%"></i></div><div class="qcard"><div class="qnum">CÂU '+item.number+'</div><div class="qtext">'+esc(item.question)+'</div><div class="visual">'+questionVisual+'</div><div class="choices">'+item.options.map(renderOption).join('')+'</div><div class="feedback" id="feedback"></div><button class="primary" id="next" disabled>'+(q===24?'Xem kết quả':'Câu tiếp theo →')+'</button></div>'}
function answer(x){if(answered)return;answered=true;const item=getQs()[q],ok=x===item.correct_answer;document.querySelectorAll('.answer').forEach(b=>{if(b.dataset.letter===x)b.classList.add(ok?'correct':'wrong');if(b.dataset.letter===item.correct_answer)b.classList.add('correct')});if(ok)score++;document.getElementById('feedback').textContent=ok?'🎉 Chính xác!':'💡 Đáp án đúng trong tài liệu: '+item.correct_answer;const next=document.getElementById('next');next.disabled=false;next.onclick=nextQ}
function nextQ(){if(q<24){q++;answered=false;renderPractice()}else finish()}
function finish(){const r=score/25;app.innerHTML='<div class="finish"><div class="stars">'+(r>=.8?'⭐⭐⭐':r>=.6?'⭐⭐':'⭐')+'</div><h2>Hoàn thành!</h2><p>Con đúng <b>'+score+'/25</b> câu.</p><button class="primary" onclick="startPractice()">🔄 Làm lại</button><button class="secondary" onclick="openTheme('+theme.id+')">📚 Chọn bài khác</button></div>'}
home();
</script>
</body></html>
