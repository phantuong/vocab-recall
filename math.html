<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Toán tư duy lớp 1</title>
<style>
:root{font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182033;background:#f4f7fb}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:14px 14px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.back{text-decoration:none;color:#475467;font-weight:800}.brand{font-weight:900;color:#7c3aed}.hero{background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;border-radius:28px;padding:25px 22px;box-shadow:0 12px 32px #7c3aed25}.hero h1{margin:0 0 7px;font-size:30px}.hero p{margin:0;line-height:1.5}.panel{background:#fff;border:1px solid #eaecf0;border-radius:24px;padding:18px;margin-top:14px;box-shadow:0 8px 28px #1018280b}.title{font-size:23px;margin:0 0 14px}.theme-grid,.lesson-list{display:grid;gap:11px}.theme-grid{grid-template-columns:repeat(2,1fr)}button{font:inherit}.theme,.lesson,.answer{background:#fff;border:1px solid #e4e7ec;border-radius:18px;cursor:pointer;text-align:left}.theme{padding:17px}.theme b{display:block;font-size:17px}.theme small,.lesson small{display:block;color:#667085;margin-top:5px;line-height:1.4}.pill{display:inline-block;margin-top:10px;background:#f4f0ff;color:#6d28d9;border-radius:99px;padding:4px 9px;font-size:11px;font-weight:900}.crumb{color:#667085;font-size:14px;margin-bottom:12px}.crumb a{color:#667085}.lesson{display:flex;gap:12px;align-items:center;padding:15px}.num{width:40px;height:40px;border-radius:13px;background:#f4f0ff;color:#7c3aed;display:grid;place-items:center;font-weight:900;flex:none}.lesson b{font-size:16px}.primary,.secondary{width:100%;padding:14px 16px;border-radius:16px;font-size:16px;font-weight:900;cursor:pointer}.primary{border:0;background:#182033;color:#fff;margin-top:12px}.secondary{border:1px solid #d0d5dd;background:#fff;color:#344054;margin-top:9px}.lesson-head h2{margin:0 0 6px;font-size:27px}.lesson-head p{margin:0;color:#667085;line-height:1.5}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 14px}.tab{padding:13px;border:2px solid #e4e7ec;border-radius:15px;background:#fff;font-weight:900;cursor:pointer}.tab.active{border-color:#7c3aed;background:#faf5ff;color:#6d28d9}.theory{line-height:1.7;font-size:17px}.theory h3{font-size:21px;margin:0 0 10px}.theory ul{padding-left:22px}.note{background:#fff9e8;border:1px solid #f6d98b;border-radius:16px;padding:12px 14px;color:#694f00;margin-top:14px}.practice-top{display:flex;justify-content:space-between;color:#667085;font-size:14px}.bar{height:8px;background:#eaecf0;border-radius:99px;overflow:hidden;margin:10px 0 16px}.bar i{display:block;height:100%;background:#ec4899}.qcard{background:#fff;border:1px solid #e4e7ec;border-radius:22px;padding:18px}.qnum{color:#7c3aed;font-weight:900;font-size:14px}.qtext{font-size:21px;font-weight:900;line-height:1.45;margin:8px 0 14px}.visual{display:none!important}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.answer{padding:15px;text-align:center;font-weight:900;font-size:18px;min-height:58px}.answer.correct{border:2px solid #16a34a;background:#f0fdf4}.answer.wrong{border:2px solid #dc2626;background:#fef2f2}.feedback{text-align:center;min-height:28px;margin:12px 0;font-weight:900}.finish{text-align:center}.stars{font-size:42px}.objects{font-size:34px;letter-spacing:6px}.mathline{font-size:30px;font-weight:900;letter-spacing:2px}.hint{font-size:13px;color:#667085;margin-top:10px}@media(max-width:620px){.theme-grid{grid-template-columns:1fr}.choices{grid-template-columns:1fr 1fr}}
</style></head>
<body><main class="wrap"><div class="top"><a class="back" href="index.html">← Góc học tập</a><div class="brand">🧠 Toán tư duy</div></div><section class="hero"><h1>🌈 Toán tư duy lớp 1</h1><p>Học theo cấu trúc của tài liệu: <b>lý thuyết → ví dụ → thực hành</b>. Câu hỏi dưới đây được lấy từ nội dung tài liệu; giao diện được dựng lại bằng HTML/CSS/JS thay vì nhúng trang PDF.</p></section><section class="panel" id="app"></section></main>
<script src="math-source.js"></script><script src="math-questions.js"></script><script>
const app=document.getElementById('app');let theme=null,lesson=null,q=0,score=0,answered=false;
const T1=[
[['91','81','11','90'],'B'],[['4','3','2'],'C'],[['🖍️ 🖍️ 🖍️ 🖍️ 🖍️','🖍️ 🖍️ 🖍️ 🖍️ 🖍️ 🖍️ 🖍️ 🖍️ 🖍️ 🖍️','🖍️ 🖍️ 🖍️','🖍️ 🖍️ 🖍️ 🖍️'],'A'],
[['🐰🐰🐰  🥕🥕','🐰🐰🐰🐰  🥕🥕','🐰🐰  🥕🥕🥕','🐰🐰🐰  🥕🥕🥕🥕'],'B'],[['8','9','10','7'],'B'],[['>','<','='],'C'],[['9: dạng đúng','9: dạng sai 1','9: dạng đúng 2','9: dạng sai 2'],'C'],[['1','4','5'],'C'],[['🌼 3 + 🌼 4','🌼 1 + 🌼 3','🌼 3','🌼 4'],'A'],[['Nhiều hơn số cục tẩy','Bằng số cục tẩy','Ít hơn số cục tẩy'],'C'],[['70','78','80','81'],'B'],[['4','3','5','2'],'A'],[['4','3','5','2'],'A'],[['6','7','Cả A và B đều đúng'],'C'],[['Di chuyển que thứ 2','Di chuyển que thứ 3','Di chuyển que thứ 10'],'A'],[['7','8','9'],'B'],[['8','9','8 và 9'],'C'],[['<','>','='],'A'],[['A','B','C','D'],'B'],[['Số chuối bằng số cam','Số chuối nhiều hơn số cam','Số chuối ít hơn số cam'],'B'],[['8','9','7','10'],'C'],[['<','>','='],'C'],[['A','B','C','D'],'C'],[['Que diêm thứ 4','Que diêm thứ 2','Que diêm thứ 5'],'B'],[['9 − 4 = 5','9 − 5 = 4','Cả A và B đều đúng'],'B'],[['A','B','C','D'],'A']
];
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function home(){theme=null;lesson=null;app.innerHTML='<h2 class="title">📚 Chọn chủ đề</h2><div class="theme-grid">'+MATH_SOURCE.map(t=>'<button class="theme" onclick="openTheme('+t.id+')"><b>'+t.icon+' '+esc(t.title)+'</b><small>'+t.lessons.length+' bài học · '+t.answers.length+' câu luyện tập</small><span class="pill">Nội dung từ tài liệu</span></button>').join('')+'</div><div class="note">Mỗi bài học được tách thành 2 màn hình: <b>📖 Lý thuyết</b> và <b>✏️ Thực hành</b>. Phần thực hành dùng câu hỏi và đáp án của tài liệu, không tạo một bộ câu hỏi mới.</div>'}
function openTheme(id){theme=MATH_SOURCE.find(x=>x.id===id);app.innerHTML='<div class="crumb"><a href="#" onclick="home();return false">← Tất cả chủ đề</a></div><h2 class="title">'+theme.icon+' '+esc(theme.title)+'</h2><div class="lesson-list">'+theme.lessons.map((l,i)=>'<button class="lesson" onclick="openLesson('+i+')"><span class="num">'+(i+1)+'</span><span><b>'+esc(l[0])+'</b><small>📖 Lý thuyết · ✏️ Thực hành</small></span></button>').join('')+'</div><button class="primary" onclick="startPractice()">✏️ Làm toàn bộ '+theme.answers.length+' câu của chủ đề</button>'}
function theoryText(name){const map={'Số và chữ số':['Có 10 số có một chữ số: 0 đến 9.','Có 5 số lẻ một chữ số: 1, 3, 5, 7, 9.','Có 5 số chẵn một chữ số: 0, 2, 4, 6, 8.','Số nhỏ nhất có một chữ số là 0; số lớn nhất là 9.','1 chục = 10 đơn vị; 10 chục = 100.','Trong số có hai chữ số, chữ số bên trái chỉ số chục và chữ số bên phải chỉ số đơn vị.'],'Phép cộng':['Cộng và trừ trong phạm vi 10.','Cộng và trừ số tròn chục.','Cộng và trừ trong phạm vi 100 không nhớ.'],'Điền phép toán, số':['Quan sát hình ảnh để xác định phép cộng, phép trừ hoặc số còn thiếu.','Chọn dấu hoặc số phù hợp với mối quan hệ được cho.'],'Bài toán que diêm':['Quan sát cấu tạo của số hoặc phép tính bằng que diêm.','Di chuyển hoặc đổi chỗ số que được yêu cầu để tạo kết quả đúng.']};return map[name]||['Đọc ví dụ và kiến thức cần nhớ của mục này trong tài liệu.','Sau đó chuyển sang phần thực hành để áp dụng đúng dạng bài vừa học.']}
function openLesson(i){lesson=theme.lessons[i];const bullets=theoryText(lesson[0]);app.innerHTML='<div class="crumb"><a href="#" onclick="openTheme('+theme.id+');return false">← '+esc(theme.title)+'</a></div><div class="lesson-head"><h2>'+esc(lesson[0])+'</h2><p>Một bài học nhỏ gồm phần kiến thức và phần thực hành.</p></div><div class="tabs"><button class="tab active">📖 Lý thuyết</button><button class="tab" onclick="startPractice()">✏️ Thực hành</button></div><article class="theory"><h3>Kiến thức cần nhớ</h3><ul>'+bullets.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></article><div class="note">Nội dung lý thuyết được rút từ phần kiến thức cần nhớ/ví dụ của tài liệu; không dùng trang PDF làm giao diện học.</div><button class="primary" onclick="startPractice()">🚀 Bắt đầu thực hành</button><button class="secondary" onclick="openTheme('+theme.id+')">Quay lại danh sách bài</button>'}
function visual(qi){if(theme.id===1&&T1[qi]){if(qi===0)return '<div class="mathline">Số có hai chữ số · hàng đơn vị = 1</div>';if(qi===1)return '<div class="mathline">49 − □5 = 24</div>';if(qi===2)return '<div class="objects">🖍️ 🖍️ 🖍️ 🖍️ 🖍️ 🖍️ 🖍️ 🖍️ 🖍️ 🖍️</div>';if(qi===3)return '<div class="objects">🐰 🐰 🐰 🐰　🥕 🥕</div>';if(qi===4)return '<div class="mathline">8 &lt; □ &lt; 10</div>';if(qi===5)return '<div class="mathline">6　□　10</div>';if(qi===7)return '<div class="mathline">□　2　3</div>';if(qi===8)return '<div class="mathline">2 &lt; □</div>';if(qi===9)return '<div class="objects">🖍️　🧽 🧽 🧽</div>';if(qi===10)return '<div class="mathline">79　→　?</div>';if(qi===11)return '<div class="mathline">4 = □</div>';if(qi===12)return '<div class="mathline">5 &lt; 🐷 &lt; 8</div>';if(qi===14)return '<div class="objects">🍌🍌🍌🍌　🍌🍌🍌🍌</div>';if(qi===15)return '<div class="mathline">🦀 &gt; 7</div>';if(qi===16)return '<div class="mathline">6　□　8</div>';if(qi===18)return '<div class="objects">🍌 🍌 🍌　🍊 🍊</div>';if(qi===19)return '<div class="mathline">5 − 2 + 4 = ?</div>';if(qi===20)return '<div class="mathline">6 − 1 − 4　□　8 − 3 − 4</div>';if(qi===23)return '<div class="objects">🍬 🍬 🍬 🍬 🍬 🍬 🍬 🍬 🍬<br>5 viên đã gạch bỏ</div>';return '<div class="hint">Hình minh họa được dựng bằng HTML/CSS để không phụ thuộc vào ảnh PDF.</div>'}return '<div class="hint">Bài này có hình minh họa trong tài liệu gốc. Phiên bản mới không nhúng ảnh PDF; phần hình sẽ được tái dựng bằng HTML/SVG theo từng dạng bài.</div>'}
function choices(qi){if(theme.id===1&&T1[qi])return T1[qi][0];return ['A','B','C','D']}
function startPractice(){q=0;score=0;answered=false;renderPractice()}
function renderPractice(){const prompt=(MATH_QUESTIONS[String(theme.id)]||[])[q]||'';const ch=choices(q);app.innerHTML='<div class="crumb"><a href="#" onclick="openTheme('+theme.id+');return false">← '+esc(theme.title)+'</a></div><div class="practice-top"><span>Câu '+(q+1)+' / '+theme.answers.length+'</span><b>⭐ '+score+'</b></div><div class="bar"><i style="width:'+(q/theme.answers.length*100)+'%"></i></div><div class="qcard"><div class="qnum">CÂU '+(q+1)+'</div><div class="qtext">'+esc(prompt)+'</div><div class="visual">'+visual(q)+'</div><div class="choices">'+ch.map((x,i)=>'<button class="answer" data-letter="'+String.fromCharCode(65+i)+'" onclick="answer(\''+String.fromCharCode(65+i)+'\')">'+esc(x)+'</button>').join('')+'</div><div class="feedback" id="feedback"></div><button class="primary" id="next" disabled onclick="nextQ">'+(q===theme.answers.length-1?'Xem kết quả':'Câu tiếp theo →')+'</button></div>'}
function answer(x){if(answered)return;answered=true;const ok=x===theme.answers[q];document.querySelectorAll('.answer').forEach(b=>{if(b.dataset.letter===x)b.classList.add(ok?'correct':'wrong');if(b.dataset.letter===theme.answers[q])b.classList.add('correct')});if(ok)score++;document.getElementById('feedback').textContent=ok?'🎉 Chính xác!':'💡 Đáp án đúng trong tài liệu: '+theme.answers[q];document.getElementById('next').disabled=false;document.getElementById('next').onclick=nextQ}
function nextQ(){if(q<theme.answers.length-1){q++;answered=false;renderPractice()}else finish()}
function finish(){const r=score/theme.answers.length;app.innerHTML='<div class="finish"><div class="stars">'+(r>=.8?'⭐⭐⭐':r>=.6?'⭐⭐':'⭐')+'</div><h2>Hoàn thành!</h2><p>Con đúng <b>'+score+'/'+theme.answers.length+'</b> câu.</p><button class="primary" onclick="startPractice()">🔄 Làm lại</button><button class="secondary" onclick="openTheme('+theme.id+')">📚 Chọn bài khác</button></div>'}
home();
</script></body></html>
