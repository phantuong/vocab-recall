<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Toán tư duy lớp 1</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f6f7fb}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:14px 14px 40px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.back{color:#475467;text-decoration:none;font-weight:750}.brand{font-weight:850;color:#7c3aed}.hero{background:linear-gradient(135deg,#7c3aed,#ec4899);color:white;border-radius:26px;padding:26px 22px;box-shadow:0 12px 32px #7c3aed25}.hero h1{margin:0 0 8px;font-size:30px}.hero p{margin:0;line-height:1.5}.panel{background:white;border:1px solid #eaecf0;border-radius:22px;padding:18px;margin-top:14px;box-shadow:0 7px 25px #1018280b}.title{font-size:22px;margin:0 0 14px}.theme-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.theme{border:1px solid #e4e7ec;background:#fff;border-radius:18px;padding:16px;text-align:left;cursor:pointer;font:inherit}.theme:active,.lesson:active,.answer:active{transform:scale(.99)}.theme b{display:block;font-size:17px}.theme small{display:block;color:#667085;line-height:1.4;margin-top:5px}.pill{display:inline-block;margin-top:10px;background:#f4f0ff;color:#6d28d9;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:800}.crumb{color:#667085;font-size:14px;margin-bottom:12px}.crumb a{color:#667085}.lesson-list{display:grid;gap:10px}.lesson{display:flex;align-items:center;gap:12px;width:100%;padding:15px;border:1px solid #e4e7ec;background:#fff;border-radius:17px;text-align:left;cursor:pointer;font:inherit}.num{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:#f4f0ff;color:#7c3aed;font-weight:850;flex:none}.lesson b{display:block}.lesson small{display:block;color:#667085;margin-top:4px}.lesson-head h2{margin:0 0 6px;font-size:26px}.lesson-head p{margin:0;color:#667085;line-height:1.5}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 14px}.tab{padding:13px;border:2px solid #e4e7ec;border-radius:15px;background:#fff;font-weight:800;cursor:pointer}.tab.active{border-color:#7c3aed;background:#faf5ff;color:#6d28d9}.source-card{border:1px solid #e4e7ec;border-radius:18px;overflow:hidden;background:#fff}.source-head{padding:13px 14px;background:#fafafa;display:flex;justify-content:space-between;gap:10px;align-items:center}.source-head b{font-size:15px}.source-head a{font-size:13px;color:#6d28d9;font-weight:800;text-decoration:none}.pdf{width:100%;height:520px;border:0;background:#f2f4f7}.page-note{padding:11px 14px;color:#667085;font-size:13px;line-height:1.45}.primary,.secondary{width:100%;padding:14px;border-radius:15px;font-size:16px;font-weight:850;cursor:pointer}.primary{border:0;background:#172033;color:white;margin-top:12px}.secondary{border:1px solid #d0d5dd;background:white;color:#344054;margin-top:9px}.practice-top{display:flex;justify-content:space-between;align-items:center;color:#667085;font-size:14px}.bar{height:8px;background:#eaecf0;border-radius:99px;overflow:hidden;margin:10px 0 14px}.bar i{display:block;height:100%;background:#ec4899}.qtitle{font-size:20px;font-weight:850;margin:10px 0}.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}.answer{padding:13px 8px;border:2px solid #e4e7ec;background:#fff;border-radius:14px;font-weight:850;font-size:17px;cursor:pointer}.answer.correct{border-color:#16a34a;background:#f0fdf4}.answer.wrong{border-color:#dc2626;background:#fef2f2}.feedback{text-align:center;min-height:25px;margin:12px 0;font-weight:800}.source-page{width:100%;height:600px;border:0}.finish{text-align:center}.stars{font-size:42px}.hide{display:none!important}@media(max-width:620px){.theme-grid{grid-template-columns:1fr}.pdf{height:470px}.source-page{height:520px}.answers{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<main class="wrap">
<div class="top"><a class="back" href="index.html">← Góc học tập</a><div class="brand">🧠 Toán tư duy</div></div>
<section class="hero"><h1>🌈 Toán tư duy lớp 1</h1><p>Học theo đúng tài liệu: <b>lý thuyết → ví dụ minh họa → bài luyện tập</b>. Nội dung và hình minh họa được lấy trực tiếp từ tài liệu nguồn.</p></section>
<section class="panel" id="app"></section>
</main>
<script src="math-source.js"></script>
<script>
const app=document.getElementById('app');let theme=null,lesson=null,q=0,score=0,answered=false;
function pdf(page){return PDF_URL+'#page='+page;}
function rangePages(range){const [a,b]=range.split('-').map(Number);return Array.from({length:b-a+1},(_,i)=>a+i)}
function home(){theme=null;lesson=null;app.innerHTML='<h2 class="title">📚 Chọn chủ đề</h2><div class="theme-grid">'+MATH_SOURCE.map(t=>'<button class="theme" onclick="openTheme('+t.id+')"><b>'+t.icon+' '+t.title+'</b><small>'+t.lessons.length+' mục học · '+t.answers.length+' câu luyện tập</small><span class="pill">Học theo tài liệu gốc</span></button>').join('')+'</div><p class="page-note">Tài liệu có 8 chủ đề, các mục nhỏ, phần kiến thức cần nhớ, ví dụ và bộ câu hỏi luyện tập kèm đáp án. Ứng dụng chỉ tổ chức lại nội dung để học tương tác; không tự thêm câu hỏi mới.</p>'}
function openTheme(id){theme=MATH_SOURCE.find(x=>x.id===id);app.innerHTML='<div class="crumb"><a href="#" onclick="home();return false">← Tất cả chủ đề</a></div><h2 class="title">'+theme.icon+' '+theme.title+'</h2><div class="lesson-list">'+theme.lessons.map((l,i)=>'<button class="lesson" onclick="openLesson('+i+')"><span class="num">'+(i+1)+'</span><span><b>'+l[0]+'</b><small>Phần lý thuyết: trang '+l[1]+' · Luyện tập: '+theme.practice+'</small></span></button>').join('')+'</div><button class="primary" onclick="startPractice()">✏️ Luyện tập toàn bộ '+theme.answers.length+' câu của chủ đề</button><p class="page-note">Phần luyện tập trong tài liệu được đặt ở cuối mỗi chủ đề, vì vậy ứng dụng giữ nguyên cấu trúc đó thay vì tự tạo câu hỏi mới.</p>'}
function openLesson(i){lesson=theme.lessons[i];const pages=rangePages(lesson[1]);app.innerHTML='<div class="crumb"><a href="#" onclick="openTheme('+theme.id+');return false">← '+theme.title+'</a></div><div class="lesson-head"><h2>'+lesson[0]+'</h2><p>Đây là nội dung gốc của mục này trong tài liệu. Hãy xem lý thuyết và ví dụ minh họa trước khi luyện tập.</p></div><div class="tabs"><button class="tab active">📖 Lý thuyết</button><button class="tab" onclick="startPractice()">✏️ Thực hành</button></div>'+pages.map((p,idx)=>'<div class="source-card" style="margin-top:12px"><div class="source-head"><b>Trang '+p+'</b><a href="'+pdf(p)+'" target="_blank">Mở trang ↗</a></div><iframe class="pdf" src="'+pdf(p)+'" title="Trang '+p+'"></iframe><div class="page-note">Trang này được hiển thị trực tiếp từ tài liệu gốc, giữ nguyên hình minh họa và cách trình bày.</div></div>').join('')+'<button class="primary" onclick="startPractice()">🚀 Bắt đầu luyện tập từ tài liệu</button><button class="secondary" onclick="openTheme('+theme.id+')">Quay lại danh sách mục</button>'}
function startPractice(){q=0;score=0;answered=false;renderPractice()}
function renderPractice(){const page=theme.qpages[q];app.innerHTML='<div class="crumb"><a href="#" onclick="openTheme('+theme.id+');return false">← '+theme.title+'</a></div><div class="practice-top"><span>Câu '+(q+1)+' / '+theme.answers.length+'</span><b>⭐ '+score+'</b></div><div class="bar"><i style="width:'+(q/theme.answers.length*100)+'%"></i></div><div class="source-card"><div class="source-head"><b>📖 Câu '+(q+1)+' trong tài liệu · trang '+page+'</b><a href="'+pdf(page)+'" target="_blank">Mở ↗</a></div><iframe class="source-page" src="'+pdf(page)+'" title="Câu '+(q+1)+'"></iframe><div class="page-note">Hãy đọc câu hỏi và nhìn hình minh họa trên trang tài liệu, sau đó chọn đáp án bên dưới.</div></div><div class="qtitle">Chọn đáp án:</div><div class="answers">'+['A','B','C','D'].map(x=>'<button class="answer" onclick="answer(\''+x+'\')">'+x+'</button>').join('')+'</div><div class="feedback" id="feedback"></div><button class="next primary" id="next" disabled onclick="nextQ()">'+(q===theme.answers.length-1?'Xem kết quả':'Câu tiếp theo →')+'</button>'}
function answer(x){if(answered)return;answered=true;const ok=x===theme.answers[q],buttons=[...document.querySelectorAll('.answer')];buttons.find(b=>b.textContent===x).classList.add(ok?'correct':'wrong');if(!ok){const c=buttons.find(b=>b.textContent===theme.answers[q]);if(c)c.classList.add('correct')}else score++;document.getElementById('feedback').textContent=ok?'🎉 Chính xác!':'💡 Đáp án đúng: '+theme.answers[q];document.getElementById('next').disabled=false}
function nextQ(){if(q<theme.answers.length-1){q++;answered=false;renderPractice()}else finish()}
function finish(){const r=score/theme.answers.length;app.innerHTML='<div class="finish"><div class="stars">'+(r>=.8?'⭐⭐⭐':r>=.6?'⭐⭐':'⭐')+'</div><h2>Hoàn thành chủ đề!</h2><p>Con đúng <b>'+score+'/'+theme.answers.length+'</b> câu.</p><button class="primary" onclick="startPractice()">🔄 Làm lại</button><button class="secondary" onclick="openTheme('+theme.id+')">📚 Chọn lại mục học</button></div>'}
home();
</script>
</body>
</html>
