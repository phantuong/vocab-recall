<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Toán tư duy lớp 1</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182230;background:#fff8ed}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:820px;margin:auto;padding:16px 14px 44px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.back{color:#475467;text-decoration:none;font-weight:700}.brand{font-weight:800;color:#7c3aed}.hero{background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;border-radius:26px;padding:26px 22px;box-shadow:0 10px 30px #7c3aed25}.hero h1{font-size:29px;margin:0 0 7px}.hero p{margin:0;line-height:1.5;opacity:.96}.panel{background:#fff;border-radius:22px;padding:20px;margin-top:16px;box-shadow:0 7px 25px #0000000d;border:1px solid #f0e8db}.section-title{font-size:21px;font-weight:800;margin:0 0 14px}.theme-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.theme{border:1px solid #e5e7eb;background:#fff;border-radius:17px;padding:15px;text-align:left;cursor:pointer;font:inherit}.theme:hover{transform:translateY(-1px)}.theme b{display:block;font-size:16px}.theme small{display:block;color:#667085;margin-top:5px;line-height:1.35}.count{display:inline-block;margin-top:9px;padding:4px 8px;border-radius:99px;background:#f4f0ff;color:#6d28d9;font-size:11px;font-weight:800}.lesson-list{display:grid;gap:10px}.lesson{width:100%;border:1px solid #e6e8ec;background:#fff;border-radius:17px;padding:16px;text-align:left;cursor:pointer;font:inherit;display:flex;gap:12px;align-items:center}.lesson .num{width:36px;height:36px;border-radius:12px;background:#f4f0ff;color:#7c3aed;display:grid;place-items:center;font-weight:800;flex:none}.lesson b{display:block}.lesson small{display:block;color:#667085;margin-top:4px}.crumb{color:#667085;font-size:14px;margin-bottom:12px}.lesson-head h2{margin:0 0 7px;font-size:25px}.lesson-head p{margin:0;color:#667085;line-height:1.45}.mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.mode{border:2px solid #e5e7eb;background:#fff;border-radius:16px;padding:13px;text-align:center;cursor:pointer;font-weight:800}.mode.active{border-color:#7c3aed;background:#faf5ff;color:#6d28d9}.theory-list{display:grid;gap:10px;margin:18px 0}.theory-item{padding:15px 16px;border-radius:16px;background:#faf8ff;border-left:4px solid #8b5cf6;line-height:1.55}.example{margin-top:15px;padding:16px;border-radius:16px;background:#fff7ed;border:1px solid #fde7c2}.example strong{display:block;margin-bottom:6px}.primary{width:100%;padding:15px;border:0;border-radius:15px;background:#7c3aed;color:#fff;font-size:17px;font-weight:800;cursor:pointer}.secondary{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:15px;background:#fff;color:#344054;font-size:16px;font-weight:750;cursor:pointer;margin-top:10px}.progress{display:flex;justify-content:space-between;color:#667085;font-size:14px}.bar{height:8px;background:#eee7dc;border-radius:99px;overflow:hidden;margin:10px 0 18px}.bar i{display:block;height:100%;background:#ec4899}.question{font-size:24px;font-weight:800;line-height:1.45;text-align:center;margin:20px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{padding:15px;border:2px solid #e5e7eb;background:#fff;border-radius:15px;font-size:18px;font-weight:750;cursor:pointer}.answer.correct{border-color:#16a34a;background:#f0fdf4}.answer.wrong{border-color:#dc2626;background:#fef2f2}.feedback{text-align:center;font-size:17px;font-weight:750;min-height:28px;margin:15px 0}.next{width:100%;padding:14px;border:0;border-radius:14px;background:#172033;color:#fff;font-size:16px;font-weight:800;cursor:pointer}.next:disabled{opacity:.35}.score{text-align:center}.stars{font-size:42px;margin:8px}.score h2{font-size:28px;margin:5px}.score p{color:#667085}.tip{color:#667085;font-size:13px;line-height:1.55;margin-top:14px}.hide{display:none!important}@media(max-width:600px){.theme-grid{grid-template-columns:1fr}.answers{grid-template-columns:1fr}.question{font-size:22px}}
</style>
</head>
<body>
<main class="wrap">
<div class="top"><a class="back" href="index.html">← Góc học tập</a><div class="brand">🧠 Toán tư duy</div></div>
<section class="hero"><h1>🌈 Toán tư duy lớp 1</h1><p>Học theo từng bài nhỏ: <b>Học lý thuyết → Xem ví dụ → Luyện tập tương tác.</b></p></section>
<section class="panel" id="screenThemes"></section>
<section class="panel hide" id="screenLessons"></section>
<section class="panel hide" id="screenLesson"></section>
<section class="panel hide" id="screenPractice"></section>
</main>
<script src="math-data.js"></script>
<script>
const THEME_INFO={
1:['🔢','Chủ đề 1: Số, chữ số và phép toán','Số và chữ số, phép cộng, điền phép toán và bài toán que diêm'],
2:['🔷','Chủ đề 2: Hình học – Biểu đồ','Hình học, đếm hình, biểu đồ, Venn và lập bảng'],
3:['⚖️','Chủ đề 3: So sánh – Đo lường – Đồng hồ','So sánh, cân nặng, độ dài, thời gian, đồng hồ, xếp hàng'],
4:['🔁','Chủ đề 4: Quy luật và logic','Quy luật tăng giảm, hình dạng, màu sắc, kích thước và hình vẽ'],
5:['➕','Chủ đề 5: Số và phép cộng trong phạm vi 10','Các số, tách gộp, so sánh, cộng trừ và thêm bớt'],
6:['📐','Chủ đề 6: Hình học','Vị trí, khối hình, hình cơ bản và đếm hình'],
7:['🕐','Chủ đề 7: Số và cộng trừ trong phạm vi 20','Số trong phạm vi 20, đồng hồ, so sánh và quy luật'],
8:['💯','Chủ đề 8: Số và cộng trừ trong phạm vi 100','Chục, số đến 40, số đến 100, lịch và độ dài']
};
let currentTheme=null,currentLesson=null,currentQ=0,score=0,answered=false;
function show(id){['screenThemes','screenLessons','screenLesson','screenPractice'].forEach(x=>document.getElementById(x).classList.add('hide'));document.getElementById(id).classList.remove('hide');window.scrollTo({top:0,behavior:'smooth'})}
function home(){show('screenThemes');renderThemes()}
function renderThemes(){const el=document.getElementById('screenThemes');el.innerHTML='<h2 class="section-title">📚 Chọn chủ đề</h2><div class="theme-grid">'+Object.keys(THEME_INFO).map(k=>{const x=THEME_INFO[k],n=MATH_LESSONS.filter(l=>l.theme==k).length;return '<button class="theme" onclick="openTheme('+k+')"><b>'+x[0]+' '+x[1]+'</b><small>'+x[2]+'</small><span class="count">'+n+' bài học</span></button>'}).join('')+'</div><p class="tip">Cấu trúc bài học được xây dựng theo mục lục và phần “Kiến thức cần nhớ” của tài liệu 1001 Bài toán tư duy lớp 1 mà bạn đã gửi. fileciteturn121file0L37-L52</p>'}
function openTheme(t){currentTheme=t;const info=THEME_INFO[t],lessons=MATH_LESSONS.filter(l=>l.theme==t);document.getElementById('screenLessons').innerHTML='<div class="crumb"><a href="#" onclick="home();return false">← Tất cả chủ đề</a></div><h2 class="section-title">'+info[0]+' '+info[1]+'</h2><p class="tip">Mỗi mục nhỏ có một phần lý thuyết riêng và một phần luyện tập riêng.</p><div class="lesson-list">'+lessons.map((l,i)=>'<button class="lesson" onclick="openLesson('+i+')"><span class="num">'+(i+1)+'</span><span><b>'+l.title+'</b><small>'+l.questions.length+' câu luyện tập</small></span></button>').join('')+'</div>';show('screenLessons')}
function openLesson(i){currentLesson=MATH_LESSONS.filter(l=>l.theme==currentTheme)[i];const l=currentLesson;document.getElementById('screenLesson').innerHTML='<div class="crumb"><a href="#" onclick="openTheme('+currentTheme+');return false">← Danh sách bài</a></div><div class="lesson-head"><h2>'+l.title+'</h2><p>Hãy đọc phần lý thuyết trước, sau đó chuyển sang luyện tập.</p></div><div class="mode-tabs"><button class="mode active">📖 Lý thuyết</button><button class="mode" onclick="startPractice()">✏️ Thực hành</button></div><div class="theory-list">'+l.theory.map((x,i)=>'<div class="theory-item"><b>'+ (i+1)+'.</b> '+x+'</div>').join('')+'</div><div class="example"><strong>💡 Cách học</strong>Đọc từng ý, tự nói lại bằng lời của mình, sau đó bấm <b>Bắt đầu luyện tập</b> để kiểm tra.</div><button class="primary" onclick="startPractice()">🚀 Bắt đầu luyện tập</button><button class="secondary" onclick="openTheme('+currentTheme+')">Quay lại danh sách bài</button>';show('screenLesson')}
function startPractice(){currentQ=0;score=0;answered=false;renderQuestion();show('screenPractice')}
function renderQuestion(){const l=currentLesson,q=l.questions[currentQ],el=document.getElementById('screenPractice');el.innerHTML='<div class="crumb"><a href="#" onclick="openLesson(MATH_LESSONS.filter(x=>x.theme==currentTheme).indexOf(currentLesson));return false">← Lý thuyết</a></div><div class="progress"><span>Câu '+(currentQ+1)+' / '+l.questions.length+'</span><b>⭐ '+score+'</b></div><div class="bar"><i style="width:'+((currentQ)/l.questions.length*100)+'%"></i></div><div class="question">'+q[0]+'</div><div class="answers">'+q[1].map((a,i)=>'<button class="answer" onclick="answer('+i+')">'+a+'</button>').join('')+'</div><div class="feedback" id="feedback"></div><button class="next" id="next" disabled onclick="nextQuestion()">'+(currentQ===l.questions.length-1?'Xem kết quả':'Câu tiếp theo →')+'</button>'}
function answer(i){if(answered)return;answered=true;const q=currentLesson.questions[currentQ],bs=document.querySelectorAll('.answer');bs[i].classList.add(i===q[2]?'correct':'wrong');bs[q[2]].classList.add('correct');const f=document.getElementById('feedback');if(i===q[2]){score++;f.textContent='🎉 Chính xác!'}else f.textContent='💡 Đáp án đúng: '+q[1][q[2]];document.getElementById('next').disabled=false}
function nextQuestion(){if(currentQ<currentLesson.questions.length-1){currentQ++;answered=false;renderQuestion()}else finish()}
function finish(){const total=currentLesson.questions.length,rate=score/total,stars=rate>=.8?'⭐⭐⭐':rate>=.6?'⭐⭐':'⭐';document.getElementById('screenPractice').innerHTML='<div class="score"><div class="stars">'+stars+'</div><h2>Hoàn thành bài!</h2><p>Con đúng <b>'+score+'/'+total+'</b> câu.</p><p>'+ (rate>=.8?'Tuyệt vời! Con đã nắm khá chắc bài này.':rate>=.6?'Rất tốt! Hãy luyện thêm một lần nữa để nhớ lâu hơn.':'Không sao! Hãy quay lại phần lý thuyết rồi thử lại nhé.')+'</p><button class="primary" onclick="startPractice()">🔄 Làm lại</button><button class="secondary" onclick="openLesson(MATH_LESSONS.filter(x=>x.theme==currentTheme).indexOf(currentLesson))">📖 Xem lại lý thuyết</button><button class="secondary" onclick="openTheme(currentTheme)">📚 Chọn bài khác</button></div>'}
renderThemes();
</script>
</body></html>
