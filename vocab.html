<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vocab Recall</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}
body{margin:0}.wrap{max-width:720px;margin:auto;padding:24px 16px 40px}.card{background:white;border-radius:20px;padding:24px;box-shadow:0 8px 30px #00000012}
h1{margin:0 0 18px;font-size:28px;text-align:center}.muted{color:#667085}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
select,button{font:inherit;border-radius:12px;padding:11px 14px;border:1px solid #d0d5dd;background:white}button{cursor:pointer}.primary{background:#172033;color:white;border-color:#172033}
.word{font-size:44px;font-weight:750;margin:20px 0 4px;word-break:break-word}.prompt-label{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#667085;margin-top:20px}.prompt{font-size:28px;font-weight:650;line-height:1.35;margin:8px 0 6px}.hint{font-size:21px;color:#667085}.timer{height:7px;background:#e4e7ec;border-radius:99px;overflow:hidden;margin:18px 0}.timer>i{display:block;height:100%;width:100%;background:#172033;transition:width .1s linear}
.answer{border-top:1px solid #eaecf0;margin-top:20px;padding-top:20px}.answer .primary{display:block;width:100%;margin-top:16px}.ipa{font-size:20px}.meaning{font-size:21px;font-weight:600;margin:10px 0}.example{font-size:21px;color:#475467;font-style:italic}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef2ff;margin:4px 4px 0 0;font-size:13px}.footer{margin-top:16px;font-size:12px;color:#98a2b3}#app{touch-action:pan-y}
</style></head>
<body><div class="wrap"><div class="card">
<div class="topnav"><a href="index.html">← Học tập</a></div><h1>Vocab Recall</h1>
<div class="controls"><label>Set <select id="set"><option>A1</option><option>B1</option><option>B2</option><option>C1</option><option>C2</option><option>TOEIC</option><option>Business</option><option>All</option></select></label><button id="start" class="primary">Start 20 words</button></div>
<div id="app"><div class="muted">Press Start to begin.</div></div>

</div></div>
<script>
const state={words:[],pool:[],i:0,revealed:false,timer:null,left:10};const $=id=>document.getElementById(id);
async function load(){ $("app").innerHTML="<div class='muted'>Loading vocabulary…</div>";const r=await fetch("data/words.json?"+Date.now());if(!r.ok)throw Error("Vocabulary data unavailable");state.words=await r.json();$("app").innerHTML="<div class='muted'>Ready — choose a set and press Start.</div>";}
function speak(w){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang="en-US";u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function makeHint(word,count){
  const letters=Array.from(word);
  const positions=Array.from({length:letters.length},(_,i)=>i).sort(()=>Math.random()-.5).slice(0,Math.min(count,letters.length)).sort((a,b)=>a-b);
  const revealed=new Set(positions);
  return letters.map((ch,i)=>revealed.has(i)?ch:"_").join(" ");
}
function start(){const set=$("set").value;state.pool=state.words.filter(x=>set==="All"||x.sets.includes(set)).sort(()=>Math.random()-.5).slice(0,20);state.i=0;show()}
function show(){clearInterval(state.timer);state.revealed=false;state.left=10;const w=state.pool[state.i];if(!w){$("app").innerHTML="<b>Session complete.</b><br><br><button onclick='start()' class='primary'>Start again</button>";return}
const hint=makeHint(w.word,w.hint_count||1);
$("app").innerHTML=`<div class="muted">Word ${state.i+1} / ${state.pool.length}</div><div class="prompt-label">Vietnamese meaning</div><div class="prompt">${esc(w.meaning||"Vietnamese meaning unavailable")}</div><div class="hint">Hint: ${esc(hint)}</div><div class="timer"><i id="bar"></i></div><button id="reveal" class="primary">Reveal answer</button><div id="detail"></div>`;
state.timer=setInterval(()=>{state.left-=.1;document.getElementById("bar").style.width=Math.max(0,state.left/10*100)+"%";if(state.left<=0){clearInterval(state.timer);reveal()}},100)}
function reveal(){if(state.revealed)return;state.revealed=true;clearInterval(state.timer);const w=state.pool[state.i];$("detail").innerHTML=`<div class="answer"><div><b>${esc(w.word)}</b> <span class="badge">${esc(w.pos||"")}</span></div><div class="ipa">${esc(w.ipa||"")}</div><button onclick='speak(${JSON.stringify(w.word)})'>🔊 Hear pronunciation</button><div class="meaning">${esc(w.meaning||"")}</div>${w.example?`<div class="example">${esc(w.example)}</div>`:""}<div>${w.sets.map(x=>`<span class="badge">${esc(x)}</span>`).join("")}</div><br><button onclick='next()' class="primary">Next</button></div>`;speak(w.word)}
function next(){if(!state.revealed)return;state.i++;show()}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
$("start").onclick=start;
document.addEventListener("click",e=>{if(e.target.id==="reveal")reveal()});
let touchStartX=0,touchStartY=0;
$("app").addEventListener("touchstart",e=>{
  if(e.touches.length!==1)return;
  touchStartX=e.touches[0].clientX;
  touchStartY=e.touches[0].clientY;
},{passive:true});
$("app").addEventListener("touchend",e=>{
  if(e.changedTouches.length!==1||!state.revealed)return;
  const dx=e.changedTouches[0].clientX-touchStartX;
  const dy=e.changedTouches[0].clientY-touchStartY;
  if(dx<-60&&Math.abs(dx)>Math.abs(dy)*1.2)next();
},{passive:true});
load().catch(e=>$("app").innerHTML="<b>Load error.</b> "+esc(e.message));
</script></body></html>
